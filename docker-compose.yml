# Ultimyr core stack: two containers, web and api, using the Postgres you already run.
# This file is reverse-proxy agnostic. Pick ONE proxy overlay via COMPOSE_FILE in .env:
#
#   Nginx Proxy Manager (default):  COMPOSE_FILE=docker-compose.yml:docker-compose.npm.yml
#   Traefik (bundled):              COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml
#   Neither (publish ports only):   COMPOSE_FILE=docker-compose.yml
#
# Database: your existing Postgres container. Create the ultimyr role and database once (deploy/postgres/setup.sql),
# set DB_NETWORK to the Docker network that container is on, and PG_HOST to its name. No Postgres is bundled;
# for a fresh machine add docker-compose.bundled-db.yml to COMPOSE_FILE.
# API/MCP only (no web container):   docker compose up -d api
#
# The api container runs the auth, content, quiz, AI gateway, notes and MCP services as separate processes
# (see docs/architecture.md). Secrets are read from ./secrets via Docker secrets (see README).

name: ultimyr

x-db-env: &db-env
  DATABASE_URL: ${DATABASE_URL:-}
  PG_HOST: ${PG_HOST:-}
  PG_PORT: ${PG_PORT:-5432}
  PG_USER: ${PG_USER:-}
  PG_DATABASE: ${PG_DATABASE:-}
  PG_SSLMODE: ${PG_SSLMODE:-disable}

# Applied to every Ultimyr container: no extra Linux capabilities and no privilege gain through setuid binaries.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Published images (default: this project's Forgejo registry). Override ULTIMYR_REGISTRY for a fork and ULTIMYR_TAG to pin a release (for example v1.2.0).
# Every service also keeps its `build:` block, so `docker compose up -d --build` still builds from source.
x-labels: &labels
  labels:
    com.centurylinklabs.watchtower.enable: "true"

services:

  # Auth, content, quiz, AI gateway, notes and MCP. Applies every service's migrations at start, then runs each service
  # as its own process (restarted on its own if it exits). Ports 4001 to 4006 are the services, 4000 the container health.
  api:
    <<: [*hardening, *labels]
    image: ${ULTIMYR_REGISTRY:-git.pwrs.dev/powers}/ultimyr-api:${ULTIMYR_TAG:-latest}
    build: { context: ., target: api }
    environment:
      <<: *db-env
      PG_PASSWORD_FILE: /run/secrets/pg_password
      ULTIMYR_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      ULTIMYR_AUTH_ENC_KEY_FILE: /run/secrets/auth_enc_key
      ULTIMYR_API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
      # Seals each person's AI keys and Fast Note Sync token. Without it the AI gateway and notes answer 503.
      ULTIMYR_VAULT_KEK_FILE: /run/secrets/vault_kek
      ULTIMYR_VAULT_KEK_VERSION: ${ULTIMYR_VAULT_KEK_VERSION:-1}
      ULTIMYR_VAULT_KEK_PREVIOUS: ${ULTIMYR_VAULT_KEK_PREVIOUS:-}
      # Public origin users reach Ultimyr on. Drives passkey (WebAuthn) binding and SSO callback URLs.
      ULTIMYR_PUBLIC_URL: ${ULTIMYR_PUBLIC_URL:-http://localhost:3000}
      ULTIMYR_ALLOW_INSECURE_IDP: ${ULTIMYR_ALLOW_INSECURE_IDP:-false}
      AUTH_REGISTRATION: ${AUTH_REGISTRATION:-open}
      # Admin panel > About asks GitHub for the latest release. Set to false for air-gapped installs; ULTIMYR_REPO points it at a fork.
      ULTIMYR_UPDATE_CHECK: ${ULTIMYR_UPDATE_CHECK:-true}
      ULTIMYR_REPO: ${ULTIMYR_REPO:-ConniptionFit/Ultimyr}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_DAILY_REQUESTS: ${AI_DAILY_REQUESTS:-200}
      # Your Fast Note Sync server. Leave empty and notes stay switched off (everything else works).
      # Bundled one: add docker-compose.notes.yml to COMPOSE_FILE (then FNS_URL=http://fns:9000)
      FNS_URL: ${FNS_URL:-}
      MCP_RATE_PER_MINUTE: ${MCP_RATE_PER_MINUTE:-120}
      MCP_WRITE_PER_MINUTE: ${MCP_WRITE_PER_MINUTE:-30}
      NODE_ENV: production
    secrets: [pg_password, jwt_private_key, auth_enc_key, api_key_pepper, vault_kek]
    networks: [default, db]
    ports:
      - "${ULTIMYR_BIND:-127.0.0.1}:${ULTIMYR_AUTH_PORT:-4001}:4001"
      - "${ULTIMYR_BIND:-127.0.0.1}:${ULTIMYR_CONTENT_PORT:-4002}:4002"
      - "${ULTIMYR_BIND:-127.0.0.1}:${ULTIMYR_QUIZ_PORT:-4003}:4003"
      - "${ULTIMYR_BIND:-127.0.0.1}:${ULTIMYR_AI_PORT:-4004}:4004"
      - "${ULTIMYR_BIND:-127.0.0.1}:${ULTIMYR_MCP_PORT:-4005}:4005"
      - "${ULTIMYR_BIND:-127.0.0.1}:${ULTIMYR_NOTES_PORT:-4006}:4006"
    restart: unless-stopped

  web:
    <<: [*hardening, *labels]
    image: ${ULTIMYR_REGISTRY:-git.pwrs.dev/powers}/ultimyr-web:${ULTIMYR_TAG:-latest}
    build:
      context: .
      target: web
      args:
        # Baked into the web image: where the web app proxies /api/v1 (the api container's service ports).
        AUTH_URL: http://api:4001
        CONTENT_URL: http://api:4002
        QUIZ_URL: http://api:4003
        AI_URL: http://api:4004
        MCP_URL: http://api:4005
        NOTES_URL: http://api:4006
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${ULTIMYR_BIND:-127.0.0.1}:${ULTIMYR_WEB_PORT:-3000}:3000"
    restart: unless-stopped

networks:
  # The Docker network your existing Postgres container is on (find it with: docker inspect postgres --format '{{json .NetworkSettings.Networks}}').
  # The api container joins it, so PG_HOST can be the container name (postgres).
  db:
    name: ${DB_NETWORK:-postgres}
    external: true

secrets:
  pg_password:
    file: ./secrets/pg_password
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  auth_enc_key:
    file: ./secrets/auth_enc_key
  api_key_pepper:
    file: ./secrets/api_key_pepper
  vault_kek:
    file: ./secrets/vault_kek
