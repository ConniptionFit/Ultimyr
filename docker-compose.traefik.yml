# Traefik overlay (alternative to Nginx Proxy Manager).
# Starts a Traefik edge on ULTIMYR_HTTP_PORT and routes by Docker labels.
# The auth service answers /api/v1/* directly, so no path rewriting is needed.

services:
  traefik:
    image: traefik:v3.2
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "${ULTIMYR_HTTP_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  auth:
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/me`) || PathPrefix(`/api/v1/admin`) || PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/groups`) || PathPrefix(`/scim/v2`) || PathPrefix(`/.well-known`)
      - traefik.http.routers.auth.priority=100
      - traefik.http.services.auth.loadbalancer.server.port=4001

  content:
    labels:
      - traefik.enable=true
      - traefik.http.routers.content.rule=PathPrefix(`/api/v1/archives`) || PathPrefix(`/api/v1/items`) || PathPrefix(`/api/v1/cards`) || PathPrefix(`/api/v1/search`) || PathPrefix(`/api/v1/import`) || PathPrefix(`/api/v1/trash`) || PathPrefix(`/api/v1/assets`) || PathPrefix(`/api/v1/access`)
      - traefik.http.routers.content.priority=100
      - traefik.http.services.content.loadbalancer.server.port=4002

  web:
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3000
