# Nginx Proxy Manager overlay (default).
#
# Attaches Ultimyr to the Docker network your NPM container is on, under stable aliases:
#   ultimyr-web:3000   the whole site (it forwards /api/v1 to the api container itself)
#   ultimyr-api:4001..4006  only needed for headless / API-only setups, one port per service:
#     4001 auth     4002 content   4003 quiz      4004 AI gateway
#     4005 MCP (/mcp and /.well-known/oauth-protected-resource)         4006 notes
#
# One-time: if NPM has no shared network yet, create one and connect NPM to it:
#   docker network create proxy && docker network connect proxy <your-npm-container>
# Or set PROXY_NETWORK in .env to the network NPM already uses.

services:
  web:
    networks:
      default: {}
      proxy:
        aliases: [ultimyr-web]
  api:
    networks:
      default: {}
      db: {}
      proxy:
        aliases: [ultimyr-api]

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
