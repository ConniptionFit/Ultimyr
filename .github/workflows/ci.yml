name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ultimyr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ultimyr_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Performance budget
        run: node scripts/check-budgets.mjs

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build --target auth -t ultimyr-auth .
          docker build --target content -t ultimyr-content .
          docker build --target quiz -t ultimyr-quiz .
          docker build --target ai-gateway -t ultimyr-ai .
          docker build --target mcp -t ultimyr-mcp .
          docker build --target migrate -t ultimyr-migrate .
          docker build --target web -t ultimyr-web .
      - name: Validate compose file
        run: |
          mkdir secrets && echo ci > secrets/pg_password && openssl genpkey -algorithm ed25519 -out secrets/jwt_private_key.pem && echo ci > secrets/auth_enc_key && echo ci > secrets/api_key_pepper && echo ci > secrets/vault_kek
          docker compose -f docker-compose.yml config --quiet
          docker network create proxy
          docker compose -f docker-compose.yml -f docker-compose.npm.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.traefik.yml config --quiet
